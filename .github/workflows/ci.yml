name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # a main roda estes mesmos gates via deploy-labs.yml
  workflow_call:

permissions:
  contents: read

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
      # Bancos descartáveis para os spikes que testam SQL real (credenciais só de teste, sem segredo).
      SPIKE_MYSQL_HOST: 127.0.0.1
      SPIKE_MYSQL_PORT: 3306
      SPIKE_MYSQL_DB: spike
      SPIKE_MYSQL_USER: spike
      SPIKE_MYSQL_PASS: spikepw
      SPIKE_PGSQL_HOST: 127.0.0.1
      SPIKE_PGSQL_PORT: 5432
      SPIKE_PGSQL_DB: spike
      SPIKE_PGSQL_USER: spike
      SPIKE_PGSQL_PASS: spikepw
      # Servidores SMTP de teste (Mailpit) para o spike de recuperação de senha: um sem TLS e um com TLS implícito.
      SPIKE_SMTP_HOST: 127.0.0.1
      SPIKE_SMTP_PORT: 1025
      SPIKE_MAILPIT_API: http://127.0.0.1:8025
      SPIKE_SMTP_TLS_PORT: 1465
      SPIKE_MAILPIT_TLS_API: http://127.0.0.1:8026
      MAILPIT_IMAGE: axllent/mailpit:v1.27

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: spike
          MYSQL_USER: spike
          MYSQL_PASSWORD: spikepw
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uspike -pspikepw --silent"
          --health-interval=5s --health-timeout=5s --health-retries=24
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: spike
          POSTGRES_USER: spike
          POSTGRES_PASSWORD: spikepw
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U spike"
          --health-interval=5s --health-timeout=5s --health-retries=24

    steps:
      - name: Checkout (histórico completo para o gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Varredura de segredos (gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks git --redact --verbose --exit-code 1 .

      - name: Termos proibidos (checklist de sanitização)
        env:
          FORBIDDEN_PATTERNS: ${{ secrets.FORBIDDEN_PATTERNS }}
        run: |
          if [ -z "$FORBIDDEN_PATTERNS" ]; then
            echo "::warning::FORBIDDEN_PATTERNS indisponível (ex.: PR de fork); checagem pulada."
            exit 0
          fi
          printf '%s\n' "$FORBIDDEN_PATTERNS" | sed '/^[[:space:]]*$/d' > "$RUNNER_TEMP/forbidden.txt"
          # Só nomes de arquivo: imprimir a linha exporia o termo no log público.
          if git ls-files -z | xargs -0 grep -IliF -f "$RUNNER_TEMP/forbidden.txt" > "$RUNNER_TEMP/hits.txt"; then
            echo "::error::Termo proibido encontrado nos arquivos:"
            cat "$RUNNER_TEMP/hits.txt"
            exit 1
          fi
          echo "Nenhum termo proibido."

      - name: Configurar PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_pgsql
          tools: none

      - name: Sintaxe PHP (php -l)
        run: |
          git ls-files -z '*.php' | xargs -0 -r -n1 php -l

      # O certificado é gerado aqui (por isso não é um service): o cliente SMTP o recebe como CA e verifica o servidor
      # de verdade, sem desligar o verify_peer.
      - name: Servidores SMTP de teste (Mailpit, sem e com TLS)
        run: |
          CERTS="$RUNNER_TEMP/smtp-tls"
          mkdir -p "$CERTS"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" -addext "basicConstraints=critical,CA:TRUE" \
            -keyout "$CERTS/key.pem" -out "$CERTS/cert.pem" 2>/dev/null
          chmod 644 "$CERTS/key.pem" "$CERTS/cert.pem"
          docker run -d --name mailpit -e MP_SMTP_AUTH_ACCEPT_ANY=1 -e MP_SMTP_AUTH_ALLOW_INSECURE=1 \
            -p 127.0.0.1:1025:1025 -p 127.0.0.1:8025:8025 "$MAILPIT_IMAGE"
          docker run -d --name mailpit-tls -v "$CERTS:/certs:ro" -e MP_SMTP_AUTH_ACCEPT_ANY=1 \
            -e MP_SMTP_TLS_CERT=/certs/cert.pem -e MP_SMTP_TLS_KEY=/certs/key.pem -e MP_SMTP_REQUIRE_TLS=1 \
            -p 127.0.0.1:1465:1025 -p 127.0.0.1:8026:8025 "$MAILPIT_IMAGE"
          echo "SPIKE_SMTP_CAFILE=$CERTS/cert.pem" >> "$GITHUB_ENV"
          for api in "$SPIKE_MAILPIT_API" "$SPIKE_MAILPIT_TLS_API"; do
            for i in $(seq 1 30); do curl -sf "$api/api/v1/info" > /dev/null && break; sleep 1; done
            curl -sf "$api/api/v1/info" > /dev/null || { echo "::error::Mailpit não respondeu em $api"; exit 1; }
          done

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Montar o site (yarn verify de cada item + página de portfólio)
        run: bash scripts/build-site.sh

      - name: Publicar _site/ como artefato
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site/
          include-hidden-files: true
          retention-days: 7
