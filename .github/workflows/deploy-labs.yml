name: Deploy Labs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labs
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-latest
    # Sem `url:`: a URL apareceria na página pública de Deployments.
    environment: labs-homolog

    steps:
      - name: Baixar _site/
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      - name: Publicar via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_LABS }}
          password: ${{ secrets.FTP_PASSWORD_LABS }}
          protocol: ftps
          port: 21
          # FTP_SERVER é um IP (mesmo padrão do pmlife) e o certificado só cobre o hostname:
          # loose mantém o TLS, mas não valida o nome do certificado.
          security: loose
          local-dir: ./_site/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Smoke test
        env:
          LABS_URL: ${{ secrets.LABS_URL }}
        run: |
          set -u
          fail=0
          check() { # check <caminho> <status esperado> [texto obrigatório no corpo]
            local code body
            body=$(curl -sS -A "pmlife-labs-smoke" -o - -w '\n%{http_code}' "${LABS_URL}$1") || true
            code=${body##*$'\n'}; body=${body%$'\n'*}
            if [ "$code" != "$2" ]; then
              echo "::error::$1 -> HTTP $code (esperado $2)"; fail=1; return
            fi
            if [ -n "${3:-}" ] && [ "$body" != "$3" ]; then
              echo "::error::$1 -> corpo inesperado"; fail=1; return
            fi
            echo "ok  $1 -> $code"
          }
          header() { # header <caminho> <trecho obrigatório no Cache-Control>
            local value
            value=$(curl -sSI -A "pmlife-labs-smoke" "${LABS_URL}$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-) || true
            case "$value" in
              *"$2"*) echo "ok  $1 -> Cache-Control: $value" ;;
              *) echo "::error::$1 -> Cache-Control '$value' (esperado conter '$2')"; fail=1 ;;
            esac
          }
          check "/" 200
          # Cache: HTML/CSS sem hash sempre revalidados; assets com hash das demos em cache longo
          header "/" "no-cache"
          header "/catalogo/spike-i18n-type-safe-react/" "no-cache"
          LABS_CSS=$(curl -sS "${LABS_URL}/" | grep -o 'assets/labs\.[0-9a-f]*\.css' | head -1)
          [ -n "$LABS_CSS" ] && echo "ok  CSS do site com hash: $LABS_CSS" || { echo "::error::a home não referencia assets/labs.<hash>.css"; fail=1; }
          header "/${LABS_CSS}" "immutable"
          header "/spikes/spike-i18n-type-safe-react/dist/" "no-cache"
          DEMO_JS=$(curl -sS "${LABS_URL}/spikes/spike-i18n-type-safe-react/dist/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          header "/spikes/spike-i18n-type-safe-react/dist/${DEMO_JS}" "immutable"
          check "/catalogo/spike-php-env-security-hostgator/" 200
          check "/catalogo/spike-eslint-clean-arch-boundaries/" 200
          check "/catalogo/spike-sql-versioned-migrations/" 200
          check "/catalogo/spike-clean-arch-frontend-ts/" 200
          check "/catalogo/poc-domain-driven-gamification-ts/" 200
          check "/catalogo/spike-i18n-type-safe-react/" 200
          check "/spikes/spike-i18n-type-safe-react/dist/" 200
          check "/spikes/spike-i18n-type-safe-react/src/Presentation/i18n/messages.ts" 403
          check "/pocs/poc-domain-driven-gamification-ts/dist/" 200
          check "/pocs/poc-domain-driven-gamification-ts/src/Domain/LearnerProgress.ts" 403
          check "/spikes/spike-clean-arch-frontend-ts/dist/" 200
          check "/spikes/spike-clean-arch-frontend-ts/dist/api/config.json" 200
          check "/spikes/spike-clean-arch-frontend-ts/src/Infrastructure/HttpConfigGateway.ts" 403
          check "/spikes/spike-sql-versioned-migrations/migrate.php" 403
          check "/spikes/spike-sql-versioned-migrations/migrations/mysql/001_create_notes.sql" 403
          check "/spikes/spike-eslint-clean-arch-boundaries/src/Domain/Task.ts" 403
          check "/spikes/spike-php-env-security-hostgator/public/status.php" 200 '{"status":"success","data":{"db":"up"}}'
          check "/spikes/spike-php-env-security-hostgator/public/status-erro.php" 500 '{"status":"error","error":{"code":"DB_UNAVAILABLE"}}'
          check "/spikes/spike-php-env-security-hostgator/public/error_log" 403
          check "/spikes/spike-sql-versioned-migrations/public/" 200
          check "/spikes/spike-sql-versioned-migrations/public/error_log" 403
          check "/spikes/spike-php-env-security-hostgator/src/db.php" 403
          check "/spikes/spike-php-env-security-hostgator/config/env.example.php" 403
          check "/.ftp-deploy-sync-state.json" 403
          exit $fail
