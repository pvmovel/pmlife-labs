name: Deploy Labs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-labs
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: deploy
    needs: ci
    runs-on: ubuntu-latest
    # Sem `url:`: a URL apareceria na página pública de Deployments.
    environment: labs-homolog

    steps:
      - name: Baixar _site/
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site/

      - name: Publicar via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME_LABS }}
          password: ${{ secrets.FTP_PASSWORD_LABS }}
          protocol: ftps
          port: 21
          # FTP_SERVER é um IP (mesmo padrão do pmlife) e o certificado só cobre o hostname:
          # loose mantém o TLS, mas não valida o nome do certificado.
          security: loose
          local-dir: ./_site/
          server-dir: ./
          dangerous-clean-slate: false

      - name: Smoke test
        env:
          LABS_URL: ${{ secrets.LABS_URL }}
        run: |
          set -u
          fail=0
          check() { # check <caminho> <status esperado> [texto obrigatório no corpo]
            local code body
            body=$(curl -sS -A "pmlife-labs-smoke" -o - -w '\n%{http_code}' "${LABS_URL}$1") || true
            code=${body##*$'\n'}; body=${body%$'\n'*}
            if [ "$code" != "$2" ]; then
              echo "::error::$1 -> HTTP $code (esperado $2)"; fail=1; return
            fi
            if [ -n "${3:-}" ] && [ "$body" != "$3" ]; then
              echo "::error::$1 -> corpo inesperado"; fail=1; return
            fi
            echo "ok  $1 -> $code"
          }
          header() { # header <caminho> <trecho obrigatório no Cache-Control>
            local value
            value=$(curl -sSI -A "pmlife-labs-smoke" "${LABS_URL}$1" | tr -d '\r' | grep -i '^cache-control:' | cut -d' ' -f2-) || true
            case "$value" in
              *"$2"*) echo "ok  $1 -> Cache-Control: $value" ;;
              *) echo "::error::$1 -> Cache-Control '$value' (esperado conter '$2')"; fail=1 ;;
            esac
          }
          check "/" 200
          # Cache: HTML/CSS sem hash sempre revalidados; assets com hash das demos em cache longo
          header "/" "no-cache"
          header "/catalogo/spike-i18n-type-safe-react/" "no-cache"
          LABS_CSS=$(curl -sS "${LABS_URL}/" | grep -o 'assets/labs\.[0-9a-f]*\.css' | head -1)
          [ -n "$LABS_CSS" ] && echo "ok  CSS do site com hash: $LABS_CSS" || { echo "::error::a home não referencia assets/labs.<hash>.css"; fail=1; }
          header "/${LABS_CSS}" "immutable"
          header "/spikes/spike-i18n-type-safe-react/dist/" "no-cache"
          DEMO_JS=$(curl -sS "${LABS_URL}/spikes/spike-i18n-type-safe-react/dist/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          header "/spikes/spike-i18n-type-safe-react/dist/${DEMO_JS}" "immutable"
          check "/catalogo/spike-php-env-security-hostgator/" 200
          check "/catalogo/spike-eslint-clean-arch-boundaries/" 200
          check "/catalogo/spike-sql-versioned-migrations/" 200
          check "/catalogo/spike-clean-arch-frontend-ts/" 200
          check "/catalogo/poc-domain-driven-gamification-ts/" 200
          check "/catalogo/spike-i18n-type-safe-react/" 200
          check "/spikes/spike-i18n-type-safe-react/dist/" 200
          check "/spikes/spike-i18n-type-safe-react/src/Presentation/i18n/messages.ts" 403
          check "/pocs/poc-domain-driven-gamification-ts/dist/" 200
          check "/pocs/poc-domain-driven-gamification-ts/src/Domain/LearnerProgress.ts" 403
          check "/spikes/spike-clean-arch-frontend-ts/dist/" 200
          check "/spikes/spike-clean-arch-frontend-ts/dist/api/config.json" 200
          check "/spikes/spike-clean-arch-frontend-ts/src/Infrastructure/HttpConfigGateway.ts" 403
          check "/spikes/spike-sql-versioned-migrations/migrate.php" 403
          check "/spikes/spike-sql-versioned-migrations/migrations/mysql/001_create_notes.sql" 403
          check "/spikes/spike-eslint-clean-arch-boundaries/src/Domain/Task.ts" 403
          check "/spikes/spike-php-env-security-hostgator/public/status.php" 200 '{"status":"success","data":{"db":"up"}}'
          check "/spikes/spike-php-env-security-hostgator/public/status-erro.php" 500 '{"status":"error","error":{"code":"DB_UNAVAILABLE"}}'
          check "/spikes/spike-php-env-security-hostgator/public/error_log" 403
          check "/spikes/spike-sql-versioned-migrations/public/" 200
          check "/spikes/spike-sql-versioned-migrations/public/error_log" 403
          check "/spikes/spike-php-env-security-hostgator/src/db.php" 403
          check "/spikes/spike-php-env-security-hostgator/config/env.example.php" 403
          check "/.ftp-deploy-sync-state.json" 403
          # US16: documentação gerada pelo TypeDoc (assets com hash injetado pelo build)
          check "/catalogo/spike-typedoc-code-documentation/" 200
          check "/spikes/spike-typedoc-code-documentation/dist/" 200
          header "/spikes/spike-typedoc-code-documentation/dist/" "no-cache"
          DOC_CSS=$(curl -sS "${LABS_URL}/spikes/spike-typedoc-code-documentation/dist/" | grep -o 'assets/style\.[0-9a-f]\{8\}\.css' | head -1)
          [ -n "$DOC_CSS" ] && header "/spikes/spike-typedoc-code-documentation/dist/${DOC_CSS}" "immutable" || { echo "::error::a demo do TypeDoc não referencia assets/style.<hash>.css"; fail=1; }
          check "/spikes/spike-typedoc-code-documentation/violations/BrokenLink.ts" 403
          # US18: SQLite WASM (o .wasm precisa de application/wasm para compilar em streaming)
          check "/catalogo/spike-sqlite-wasm-browser-persistence/" 200
          check "/spikes/spike-sqlite-wasm-browser-persistence/dist/" 200
          check "/spikes/spike-sqlite-wasm-browser-persistence/src/Infrastructure/sqlite.worker.ts" 403
          # HTML -> index-<hash>.js -> sqlite.worker-<hash>.js -> sqlite3-<hash>.wasm
          SQL_BASE="${LABS_URL}/spikes/spike-sqlite-wasm-browser-persistence/dist"
          ENTRY=$(curl -sS "${SQL_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          WORKER=$(curl -sS "${SQL_BASE}/${ENTRY}" | grep -o 'sqlite\.worker-[A-Za-z0-9_-]*\.js' | head -1)
          WASM=$(curl -sS "${SQL_BASE}/assets/${WORKER}" | grep -o 'sqlite3-[A-Za-z0-9_-]*\.wasm' | head -1)
          if [ -n "$WASM" ]; then
            header "/spikes/spike-sqlite-wasm-browser-persistence/dist/assets/${WASM}" "immutable"
            ctype=$(curl -sSI -A "pmlife-labs-smoke" "${LABS_URL}/spikes/spike-sqlite-wasm-browser-persistence/dist/assets/${WASM}" | tr -d '\r' | grep -i '^content-type:' | cut -d' ' -f2-)
            case "$ctype" in application/wasm*) echo "ok  ${WASM} -> Content-Type: $ctype" ;; *) echo "::error::${WASM} -> Content-Type '$ctype' (esperado application/wasm)"; fail=1 ;; esac
          else
            echo "::error::não achei o .wasm referenciado pelo worker do SQLite"; fail=1
          fi
          # US19: cidade 3D orientada a dados (fonte local com hash, three.js em chunk separado)
          check "/catalogo/poc-r3f-data-driven-city/" 200
          check "/pocs/poc-r3f-data-driven-city/dist/" 200
          header "/pocs/poc-r3f-data-driven-city/dist/" "no-cache"
          check "/pocs/poc-r3f-data-driven-city/src/Content/Curriculum/culinaria/buildings.json" 403
          CITY_BASE="${LABS_URL}/pocs/poc-r3f-data-driven-city/dist"
          CITY_ENTRY=$(curl -sS "${CITY_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          CITY_FONT=$(curl -sS "${CITY_BASE}/${CITY_ENTRY}" | grep -o 'CityCanvas3D-[A-Za-z0-9_-]*\.js' | head -1)
          CITY_FONT=$(curl -sS "${CITY_BASE}/assets/${CITY_FONT}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$CITY_FONT" ] && header "/pocs/poc-r3f-data-driven-city/dist/assets/${CITY_FONT}" "immutable" || { echo "::error::não achei a fonte com hash da cidade 3D"; fail=1; }
          # US20: avatar em 3ª pessoa (fonte local com hash no chunk da cena)
          check "/catalogo/poc-r3f-third-person-avatar/" 200
          check "/pocs/poc-r3f-third-person-avatar/dist/" 200
          header "/pocs/poc-r3f-third-person-avatar/dist/" "no-cache"
          check "/pocs/poc-r3f-third-person-avatar/src/Domain/Movement.ts" 403
          AV_BASE="${LABS_URL}/pocs/poc-r3f-third-person-avatar/dist"
          AV_ENTRY=$(curl -sS "${AV_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          AV_SCENE=$(curl -sS "${AV_BASE}/${AV_ENTRY}" | grep -o 'AvatarCanvas-[A-Za-z0-9_-]*\.js' | head -1)
          AV_FONT=$(curl -sS "${AV_BASE}/assets/${AV_SCENE}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$AV_FONT" ] && header "/pocs/poc-r3f-third-person-avatar/dist/assets/${AV_FONT}" "immutable" || { echo "::error::não achei a fonte com hash do avatar 3D"; fail=1; }
          # US21: proximidade e HUD (fonte local com hash no chunk da cena)
          check "/catalogo/poc-r3f-proximity-interaction-hud/" 200
          check "/pocs/poc-r3f-proximity-interaction-hud/dist/" 200
          header "/pocs/poc-r3f-proximity-interaction-hud/dist/" "no-cache"
          check "/pocs/poc-r3f-proximity-interaction-hud/src/Domain/Proximity.ts" 403
          HUD_BASE="${LABS_URL}/pocs/poc-r3f-proximity-interaction-hud/dist"
          HUD_ENTRY=$(curl -sS "${HUD_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          HUD_SCENE=$(curl -sS "${HUD_BASE}/${HUD_ENTRY}" | grep -o 'AvatarCanvas-[A-Za-z0-9_-]*\.js' | head -1)
          HUD_FONT=$(curl -sS "${HUD_BASE}/assets/${HUD_SCENE}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$HUD_FONT" ] && header "/pocs/poc-r3f-proximity-interaction-hud/dist/assets/${HUD_FONT}" "immutable" || { echo "::error::não achei a fonte com hash da PoC de proximidade"; fail=1; }
          # US27: seleção de prédios no modo orbital (fonte local com hash no chunk da cena)
          check "/catalogo/poc-r3f-orbital-building-picking/" 200
          check "/pocs/poc-r3f-orbital-building-picking/dist/" 200
          header "/pocs/poc-r3f-orbital-building-picking/dist/" "no-cache"
          check "/pocs/poc-r3f-orbital-building-picking/src/Presentation/Engine3D/picking.ts" 403
          ORB_BASE="${LABS_URL}/pocs/poc-r3f-orbital-building-picking/dist"
          ORB_ENTRY=$(curl -sS "${ORB_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          ORB_SCENE=$(curl -sS "${ORB_BASE}/${ORB_ENTRY}" | grep -o 'AvatarCanvas-[A-Za-z0-9_-]*\.js' | head -1)
          ORB_FONT=$(curl -sS "${ORB_BASE}/assets/${ORB_SCENE}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$ORB_FONT" ] && header "/pocs/poc-r3f-orbital-building-picking/dist/assets/${ORB_FONT}" "immutable" || { echo "::error::não achei a fonte com hash da PoC do modo orbital"; fail=1; }
          # US29: joystick de toque (fonte local com hash no chunk da cena)
          check "/catalogo/poc-r3f-touch-avatar-joystick/" 200
          check "/pocs/poc-r3f-touch-avatar-joystick/dist/" 200
          header "/pocs/poc-r3f-touch-avatar-joystick/dist/" "no-cache"
          check "/pocs/poc-r3f-touch-avatar-joystick/src/Domain/TouchJoystick.ts" 403
          JOY_BASE="${LABS_URL}/pocs/poc-r3f-touch-avatar-joystick/dist"
          JOY_ENTRY=$(curl -sS "${JOY_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          JOY_SCENE=$(curl -sS "${JOY_BASE}/${JOY_ENTRY}" | grep -o 'AvatarCanvas-[A-Za-z0-9_-]*\.js' | head -1)
          JOY_FONT=$(curl -sS "${JOY_BASE}/assets/${JOY_SCENE}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$JOY_FONT" ] && header "/pocs/poc-r3f-touch-avatar-joystick/dist/assets/${JOY_FONT}" "immutable" || { echo "::error::não achei a fonte com hash da PoC do joystick de toque"; fail=1; }
          # US22b: NPCs com diálogo (mock PHP, sem IA). Persona inventada ➔ 400 INVALID_PERSONA prova a lista branca.
          check "/catalogo/poc-r3f-ai-npc-dialog/" 200
          check "/pocs/poc-r3f-ai-npc-dialog/dist/" 200
          header "/pocs/poc-r3f-ai-npc-dialog/dist/" "no-cache"
          for path in api/npc_mock.php api/personas.php tests/npc_mock_test.php src/Content/npcs.json; do
            check "/pocs/poc-r3f-ai-npc-dialog/${path}" 403
          done
          NPC_BASE="${LABS_URL}/pocs/poc-r3f-ai-npc-dialog/dist"
          NPC_ENTRY=$(curl -sS "${NPC_BASE}/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          NPC_SCENE=$(curl -sS "${NPC_BASE}/${NPC_ENTRY}" | grep -o 'AvatarCanvas-[A-Za-z0-9_-]*\.js' | head -1)
          NPC_FONT=$(curl -sS "${NPC_BASE}/assets/${NPC_SCENE}" | grep -o 'inter-latin-600-normal-[A-Za-z0-9_-]*\.woff' | head -1)
          [ -n "$NPC_FONT" ] && header "/pocs/poc-r3f-ai-npc-dialog/dist/assets/${NPC_FONT}" "immutable" || { echo "::error::não achei a fonte com hash da PoC de NPCs"; fail=1; }
          check "/pocs/poc-r3f-ai-npc-dialog/public/npc_chat.php" 405 '{"status":"error","error":{"code":"METHOD_NOT_ALLOWED"}}'
          npc=$(curl -sS -A "pmlife-labs-smoke" -o - -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"persona":"smoke-test-inexistente","message":"oi"}' "${LABS_URL}/pocs/poc-r3f-ai-npc-dialog/public/npc_chat.php") || true
          npc_code=${npc##*$'\n'}; npc_body=${npc%$'\n'*}
          if [ "$npc_code" = "400" ] && [ "$npc_body" = '{"status":"error","error":{"code":"INVALID_PERSONA"}}' ]; then
            echo "ok  POST npc_chat.php com persona inventada -> 400 INVALID_PERSONA"
          else
            echo "::error::POST npc_chat.php -> HTTP $npc_code (esperado 400 INVALID_PERSONA): ${npc_body:0:200}"; fail=1
          fi
          npc=$(curl -sS -A "pmlife-labs-smoke" -o - -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"persona":"astronomer","message":"E o segundo?","history":[{"question":"Qual o maior planeta?","answer":"Júpiter."}]}' "${LABS_URL}/pocs/poc-r3f-ai-npc-dialog/public/npc_chat.php") || true
          npc_code=${npc##*$'\n'}; npc_body=${npc%$'\n'*}
          if [ "$npc_code" = "200" ] && grep -q 'Qual o maior planeta?' <<<"$npc_body"; then
            echo "ok  POST npc_chat.php com histórico -> 200 citando a pergunta anterior"
          else
            echo "::error::POST npc_chat.php com histórico -> HTTP $npc_code: ${npc_body:0:200}"; fail=1
          fi
          # US22a: gateway de IA. Pedido INVÁLIDO de propósito, com SQL na pergunta: o nosso 400 prova que o endpoint
          # está no ar, que o env fora do webroot carregou (sem ele seria 500) e que o mod_security não barrou o SQL,
          # sem gastar nenhuma cota de IA.
          check "/catalogo/spike-zero-cost-ai-gateway/" 200
          check "/spikes/spike-zero-cost-ai-gateway/dist/" 200
          header "/spikes/spike-zero-cost-ai-gateway/dist/" "no-cache"
          for path in src/Ai/Personas/tutor.php src/bootstrap.php config/env.example.php migrations/mysql/001_create_ai_rate_limit.sql scripts/purge-rate-limit.php scripts/check-providers.php tests/run.php; do
            check "/spikes/spike-zero-cost-ai-gateway/${path}" 403
          done
          check "/spikes/spike-zero-cost-ai-gateway/public/ai_chat.php" 405 '{"status":"error","error":{"code":"METHOD_NOT_ALLOWED"}}'
          AI_BODY='{"persona":"smoke-test-inexistente","message":"Como funciona o RLS? SELECT * FROM alunos WHERE id = 1 UNION SELECT senha FROM usuarios; DROP TABLE x; --"}'
          ai=$(curl -sS -A "pmlife-labs-smoke" -o - -w '\n%{http_code}' -X POST -H 'Content-Type: application/json' --data "$AI_BODY" "${LABS_URL}/spikes/spike-zero-cost-ai-gateway/public/ai_chat.php") || true
          ai_code=${ai##*$'\n'}; ai_body=${ai%$'\n'*}
          if [ "$ai_code" = "400" ] && [ "$ai_body" = '{"status":"error","error":{"code":"INVALID_REQUEST"}}' ]; then
            echo "ok  POST ai_chat.php com SQL -> 400 INVALID_REQUEST (endpoint no ar, env carregado, mod_security não barrou)"
          else
            echo "::error::POST ai_chat.php -> HTTP $ai_code (esperado 400 INVALID_REQUEST): ${ai_body:0:200}"; fail=1
          fi
          # US31: sincronização offline-first (demo estática; código-fonte bloqueado; bundle com hash imutável).
          check "/catalogo/spike-offline-first-progress-sync/" 200
          check "/spikes/spike-offline-first-progress-sync/dist/" 200
          header "/spikes/spike-offline-first-progress-sync/dist/" "no-cache"
          check "/spikes/spike-offline-first-progress-sync/src/Domain/ProgressMerge.ts" 403
          SYNC_JS=$(curl -sS "${LABS_URL}/spikes/spike-offline-first-progress-sync/dist/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          [ -n "$SYNC_JS" ] && header "/spikes/spike-offline-first-progress-sync/dist/${SYNC_JS}" "immutable" || { echo "::error::a demo de sincronização não referencia assets/index-<hash>.js"; fail=1; }
          # US30: contas e multi-tenant. Sem demo ao vivo de propósito (um cadastro público seria alvo de abuso): os
          # endpoints e o código ficam bloqueados (403) no servidor, e a prova é a execução do verify no catálogo.
          check "/catalogo/spike-php-session-auth-multitenant/" 200
          for path in http/api/login.php http/api/register.php http/api/me.php src/Auth/AuthService.php migrations/pgsql/004_enable_rls_progress_events.sql scripts/verify.php; do
            check "/spikes/spike-php-session-auth-multitenant/${path}" 403
          done
          exit $fail
